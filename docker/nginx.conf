server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Ne pas mettre index.html en cache pour recevoir les mises à jour immédiatement
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache long pour les fichiers générés par Vite (avec hash unique dans le nom)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

# Bloquer tous les fichiers/dossiers commençant par un point (.htaccess, .env, .git, .DS_Store...)
    # SAUF /.well-known/ (nécessaire pour assetlinks.json des Deep Links Android et Let's Encrypt)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Fallback Vue Router (équivalent du .htaccess dans SETUP.md)
    location / {
        try_files $uri $uri/ /index.html;
    }
}