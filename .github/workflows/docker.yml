name: Build & Push Docker Image

on:
  push:
    branches: [ "main" ] # Remplacez par "master" si votre branche principale s'appelle master

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/galaxaris/ruralien:latest

      - name: Déclencher la mise à jour sur Portainer
        run: curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"    